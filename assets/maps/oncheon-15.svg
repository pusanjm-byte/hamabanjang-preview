<desc id="map-d">지하철 1호선 온천장역·명륜역·동래역, 4호선, 온천천, 중앙대로와 온천동 주택가를 그린 약도입니다. 관리 건물 주변은 흐린 초록 원으로만 표시했고, 정확한 위치는 표시하지 않았습니다.</desc>
